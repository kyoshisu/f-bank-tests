name: F-Bank Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'stable'
    
    - name: Setup ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
        wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -o chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/bin/chromedriver
        sudo chmod +x /usr/bin/chromedriver
        chromedriver --version
    
    - name: Setup app files
      run: |
        mkdir -p app
        if [ -f "index.html" ]; then
          mv index.html app/ 2>/dev/null || true
          mv vite.svg app/ 2>/dev/null || true
          mv assets app/ 2>/dev/null || true
        fi
    
    - name: Start local server
      run: |
        python -m http.server 3000 --directory app &
        sleep 5
        curl -I http://localhost:3000/
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short