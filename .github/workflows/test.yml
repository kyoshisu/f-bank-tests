name: F-Bank Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
        sudo ln -sf /usr/bin/chromedriver /usr/local/bin/chromedriver
        chromium-browser --version
        chromedriver --version
    
    - name: Setup app files
      run: |
        mkdir -p app
        
        for file in index.html vite.svg; do
          if [ -f "$file" ]; then
            mv "$file" app/ 2>/dev/null || true
          fi
        done
        
        if [ -d "assets" ]; then
          mv assets app/ 2>/dev/null || true
        fi
        
        if [ ! -f "app/index.html" ]; then
          echo '<html><body><h1>F-Bank App</h1><div id="root"></div></body></html>' > app/index.html
        fi
        
        ls -la app/
    
    - name: Start local server
      run: |
        python -m http.server 3000 --directory app &
        sleep 3
        curl -I http://localhost:3000/ || echo "Server started but curl failed"
    
    - name: Run tests
      run: |
        export PATH=$PATH:/usr/local/bin
        pytest tests/ -v --tb=short